name: Deploy docs to serv00

# Publishes the site to the serv00 host over FTPS on every push to main, so the docs no longer
# drift behind the repo. Uses git-ftp (the same tool as the manual git-ftp-commands.txt), which
# honours .git-ftp-include / .git-ftp-ignore and keeps the incremental .git-ftp.log state ON THE
# SERVER — so this deploys exactly what a manual `git ftp push` would, only automatically.
#
# After the FTP push it SSHes into the server and runs `composer update`, so the server's
# vendor/ (which is FTP-ignored) never drifts from the deployed app code — the fix for the
# "middleware signature must be compatible" fatals after a framework bump.
#
# Required secrets — all stored in the "Deployment" GitHub Environment (the job declares
# `environment: Deployment` below so they're injected; environment secrets are empty otherwise):
#   FTP_URL          full FTPS URL incl. remote path, e.g. ftpes://s15.serv00.com/<remote-app-root>/
#                    (use the SAME value your manual git config git-ftp.url uses)
#   FTP_USERNAME     FTP account username
#   FTP_PASSWORD     FTP account password
# The post-FTP SSH step uses its OWN secrets, independent of the FTP creds:
#   SSH_HOST         SSH host, e.g. s15.serv00.com  (or your panel's SSH host)
#   SSH_USERNAME     SSH login username
#   SSH_KEY          PRIVATE key (OpenSSH format) whose public half is in the server's
#                    ~/.ssh/authorized_keys — this is the reliable path on serv00, which
#                    rejects the plain `password` auth method (hence "attempted methods [none]").
#   SSH_PASSWORD     (fallback) only works if the host actually offers `password` auth
#   SSH_PORT         (optional) SSH port; defaults to 22 if unset
# Provide EITHER SSH_KEY (preferred) OR SSH_PASSWORD. Generate a key + register it on serv00:
#   ssh-keygen -t ed25519 -f serv00_deploy -N ""      # creates serv00_deploy (+ .pub)
#   ssh-copy-id -i serv00_deploy.pub USER@SSH_HOST     # keyboard-interactive login works here
#   then paste the contents of serv00_deploy into the SSH_KEY secret.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-serv00
  cancel-in-progress: false # never abort a mid-flight upload

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Deployment # inject the FTP_* secrets stored in this GitHub Environment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-ftp diffs commits, so it needs full history

      - name: Install git-ftp
        run: sudo apt-get update && sudo apt-get install -y git-ftp

      - name: Deploy via git-ftp (FTPS)
        env:
          FTP_URL: ${{ secrets.FTP_URL }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_URL:-}" ]; then
            echo "::error::FTP_URL is empty — the secrets did not reach this job. Confirm FTP_URL / FTP_USERNAME / FTP_PASSWORD exist in the 'Deployment' environment (Settings → Environments → Deployment), which this job targets via 'environment: Deployment'."
            exit 1
          fi
          git config git-ftp.url "$FTP_URL"
          git config git-ftp.user "$FTP_USER"
          git config git-ftp.password "$FTP_PASSWORD"
          # serv00's FTPS certificate does not verify (matches the manual `ssl:verify-certificate no`).
          # --auto-init uploads everything on the very first run (no server-side .git-ftp.log yet),
          # then subsequent runs deploy only the changed files.
          git ftp push --insecure --auto-init --verbose

      # Verify the SSH secrets actually reached the job BEFORE invoking the SSH action. An empty
      # SSH_PASSWORD is exactly what produces appleboy's "attempted methods [none]" handshake
      # error — the action sends no credential at all. If anything is missing we WARN and skip
      # (the docs are already deployed above) rather than fail the whole run red.
      - name: Check SSH secrets present
        id: sshcheck
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=
          [ -z "${SSH_HOST:-}" ] && missing="$missing SSH_HOST"
          [ -z "${SSH_USERNAME:-}" ] && missing="$missing SSH_USERNAME"
          [ -z "${SSH_KEY:-}" ] && [ -z "${SSH_PASSWORD:-}" ] && missing="$missing SSH_KEY-or-SSH_PASSWORD"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping composer-update: missing SSH secret(s) →$missing. Add them to the 'Deployment' environment. serv00 rejects the plain password method ('attempted methods [none]') — prefer SSH_KEY."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SSH secrets present (host ${#SSH_HOST} chars, user ${#SSH_USERNAME} chars, auth=$([ -n "${SSH_KEY:-}" ] && echo key || echo password))."
          fi

      # Keep the server's (FTP-ignored) vendor/ in sync with the just-deployed app code. dev-main
      # is a moving branch, so `composer update` re-resolves it (composer.lock isn't deployed, so
      # `composer install` can't) — this realigns MiddlewareInterface etc. with the app.
      - name: Sync vendor on serv00 (composer update)
        if: steps.sshcheck.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}            # preferred on serv00 (publickey auth)
          password: ${{ secrets.SSH_PASSWORD }}  # fallback; only if the host offers `password` auth
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd ~/domains/basttyydev.serv00.net/public_html
            export COMPOSER_MEMORY_LIMIT=-1
            # serv00 provides `composer`; fall back to a php composer.phar if it isn't on PATH.
            if command -v composer >/dev/null 2>&1; then COMPOSER="composer"; else COMPOSER="php composer.phar"; fi
            $COMPOSER update eyika/atom-framework -W --no-interaction --no-progress --prefer-dist
