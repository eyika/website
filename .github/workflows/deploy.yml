name: Deploy docs to serv00 (DEPRECATED — git-ftp)

# DEPRECATED: serv00's FTP server aborts bulk transfers ("curl 451 / partial file"), which left
# larger files truncated/empty on the host. Deployment moved to a git-pull model instead: a GitHub
# push webhook hits /deploy/github (DeployController), which flags a serv00 cron (deploy.sh) that
# runs `git pull` + composer. This workflow is kept as a manual-only fallback (workflow_dispatch)
# and no longer runs on push. See deploy.sh + DeployController for the current path.
#
# --- original description ---
# Publishes the site to the serv00 host over FTPS. Uses git-ftp, which honours
# .git-ftp-include / .git-ftp-ignore and keeps the incremental .git-ftp.log state ON THE SERVER.
#
# This deploys APP CODE only. vendor/ is FTP-ignored, so after a framework bump (eyika/atom-framework
# is a moving branch) you must refresh it manually — serv00 SSH is gated behind a 2FA OTP, which no
# unattended CI step can answer, so this is intentionally a human step:
#
#     ssh basttyydev@s15.serv00.com            # enter password, then the 2FA code
#     cd ~/domains/basttyydev.serv00.net/public_html
#     composer update eyika/atom-framework -W  # realigns vendor/ with the deployed app code
#
# (composer.lock is git-ignored / not deployed, so `composer install` can't pin it — use update.)
#
# Required secrets — stored in the "Deployment" GitHub Environment (the job declares
# `environment: Deployment` below so they're injected; environment secrets are empty otherwise):
#   FTP_URL          full FTPS URL incl. remote path, e.g. ftpes://s15.serv00.com/<remote-app-root>/
#                    (use the SAME value your manual git config git-ftp.url uses)
#   FTP_USERNAME     FTP account username
#   FTP_PASSWORD     FTP account password

on:
  workflow_dispatch: {} # manual-only fallback; push-triggered deploy is now the git webhook

concurrency:
  group: deploy-serv00
  cancel-in-progress: false # never abort a mid-flight upload

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Deployment # inject the FTP_* secrets stored in this GitHub Environment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-ftp diffs commits, so it needs full history

      - name: Install git-ftp
        run: sudo apt-get update && sudo apt-get install -y git-ftp

      - name: Deploy via git-ftp (FTPS)
        env:
          FTP_URL: ${{ secrets.FTP_URL }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_URL:-}" ]; then
            echo "::error::FTP_URL is empty — the secrets did not reach this job. Confirm FTP_URL / FTP_USERNAME / FTP_PASSWORD exist in the 'Deployment' environment (Settings → Environments → Deployment), which this job targets via 'environment: Deployment'."
            exit 1
          fi
          git config git-ftp.url "$FTP_URL"
          git config git-ftp.user "$FTP_USER"
          git config git-ftp.password "$FTP_PASSWORD"
          # serv00's FTPS certificate does not verify (matches the manual `ssl:verify-certificate no`).
          # --auto-init uploads everything on the very first run (no server-side .git-ftp.log yet),
          # then subsequent runs deploy only the changed files.
          git ftp push --insecure --auto-init --verbose
